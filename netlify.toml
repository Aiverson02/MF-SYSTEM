[build]
  command = "npm run build"
  publish = "dist"

# SPA: todas as rotas (ex.: /admin/dashboard, /inscricao) servem o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker deve revalidar sempre; o resto do assets é cacheado longamente
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
